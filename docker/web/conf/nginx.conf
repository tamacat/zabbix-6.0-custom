# zabbix-web用の最小限のnginx設定 [FR3.1]。PHP-FPMへプロキシするリバースプロキシとしてのみ動作する。
# HTTPS終端はこのイメージの責務外(公式zabbix-web-nginx-mysqlイメージと同様、TLS終端は
# フロントのロードバランサ/リバースプロキシ側で行う想定)。
#
# masterプロセス自体を非rootの`zabbix`ユーザーで起動する(Dockerfile `USER zabbix`)ため、
# `user`ディレクティブは指定しない — root以外で起動した場合、指定してもworkerの
# 実効ユーザーはmasterと同じままになる(setuidにはroot権限が必要なため)。
#
# トップレベル(mainコンテキスト)のerror_logは、httpブロック内のerror_logディレクティブ
# より前の起動処理(設定ファイル自体の読み込み等)で使われる。これを指定しないと、
# Alpineのnginxパッケージの既定値である/var/lib/nginx/logs/error.log(root所有、
# 非rootのzabbixユーザーには書き込み不可)を開こうとして権限エラーで即座に落ちる
# ([emerg] ... Permission denied、実機テストで判明)。httpブロック内のaccess_log/error_logは
# それより後のリクエスト処理用であり、これとは別に指定が必要。
error_log /dev/stderr warn;

worker_processes auto;
pid /tmp/nginx.pid;

events {
	worker_connections 1024;
}

http {
	include /etc/nginx/mime.types;
	default_type application/octet-stream;
	sendfile on;
	keepalive_timeout 65;
	client_max_body_size 16m;

	# 非rootユーザー(zabbix)で書き込み可能な一時ディレクトリを明示する
	# (Dockerfileでchown済み。既定の/var/lib/nginx/tmp配下はrootのみ書き込み可能なため)。
	client_body_temp_path /tmp/nginx-client-body;
	proxy_temp_path /tmp/nginx-proxy;
	fastcgi_temp_path /tmp/nginx-fastcgi;
	uwsgi_temp_path /tmp/nginx-uwsgi;
	scgi_temp_path /tmp/nginx-scgi;

	access_log /dev/stdout;
	error_log /dev/stderr warn;

	server {
		listen 8080;
		server_name _;
		root /usr/share/zabbix;
		index index.php;

		location / {
			try_files $uri $uri/ =404;
		}

		location ~ \.php$ {
			fastcgi_pass 127.0.0.1:9000;
			fastcgi_index index.php;
			fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
			include fastcgi_params;
		}

		location ~ /\.ht {
			deny all;
		}
	}
}
