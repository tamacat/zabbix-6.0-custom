# zabbix-web用の最小限のnginx設定 [FR3.1]。PHP-FPMへプロキシするリバースプロキシとしてのみ動作する。
# HTTPSは、公式イメージと同じく /etc/ssl/nginx に ssl.crt と ssl.key(任意で dhparam.pem)を
# マウントしたときだけ8443で待ち受ける(entrypoint.shが /tmp/zabbix-nginx/server.conf に書く)。
# access_log・server_tokens・real_ip・index・GUIアクセス制限も、環境変数から同じく
# entrypoint.shが /tmp/zabbix-nginx/*.conf に書き出し、ここからincludeする。
#
# masterプロセス自体を非rootの`zabbix`ユーザーで起動する(Dockerfile `USER zabbix`)ため、
# `user`ディレクティブは指定しない — root以外で起動した場合、指定してもworkerの
# 実効ユーザーはmasterと同じままになる(setuidにはroot権限が必要なため)。
#
# トップレベル(mainコンテキスト)のerror_logは、httpブロック内のerror_logディレクティブ
# より前の起動処理(設定ファイル自体の読み込み等)で使われる。これを指定しないと、
# Alpineのnginxパッケージの既定値である/var/lib/nginx/logs/error.log(root所有、
# 非rootのzabbixユーザーには書き込み不可)を開こうとして権限エラーで即座に落ちる
# ([emerg] ... Permission denied、実機テストで判明)。httpブロック内のaccess_log/error_logは
# それより後のリクエスト処理用であり、これとは別に指定が必要。
error_log /dev/stderr warn;

worker_processes auto;
pid /tmp/nginx.pid;

events {
	worker_connections 1024;
}

http {
	include /etc/nginx/mime.types;
	default_type application/octet-stream;
	sendfile on;
	keepalive_timeout 65;
	client_max_body_size 16m;

	# 非rootユーザー(zabbix)で書き込み可能な一時ディレクトリを明示する
	# (Dockerfileでchown済み。既定の/var/lib/nginx/tmp配下はrootのみ書き込み可能なため)。
	client_body_temp_path /tmp/nginx-client-body;
	proxy_temp_path /tmp/nginx-proxy;
	fastcgi_temp_path /tmp/nginx-fastcgi;
	uwsgi_temp_path /tmp/nginx-uwsgi;
	scgi_temp_path /tmp/nginx-scgi;

	error_log /dev/stderr warn;
	include /tmp/zabbix-nginx/http.conf;

	server {
		listen 8080;
		server_name _;
		root /usr/share/zabbix;
		include /tmp/zabbix-nginx/server.conf;

		# 外から取れてはいけないもの。PHPの内部ファイル(app/ include/ vendor/)、設定(conf/ local/)、
		# 翻訳の原本(locale/)、同梱ライブラリの一覧(composer.json / composer.lock — 版が分かる)。
		# これらはPHPがサーバー内で読むだけで、ブラウザが直接取りに来ることはない。公式の
		# zabbix-web-nginx-mysql イメージも同様に拒否している。放置すると、PHPの内部ファイルが
		# 単体で実行されたり(エラーが出る)、ライブラリの版が外から読めたりする。
		# `^~` は、下の `\.php$` の正規表現より先に選ばれる(PHPファイルを単体で実行させない)。
		location ^~ /app/ { return 404; }
		location ^~ /conf/ { return 404; }
		location ^~ /include/ { return 404; }
		location ^~ /local/ { return 404; }
		location ^~ /locale/ { return 404; }
		location ^~ /vendor/ { return 404; }
		location = /composer.json { return 404; }
		location = /composer.lock { return 404; }

		location / {
			try_files $uri $uri/ =404;
		}

		location ~ \.php$ {
			fastcgi_pass 127.0.0.1:9000;
			fastcgi_index index.php;
			fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
			include fastcgi_params;
		}

		location ~ /\.ht {
			deny all;
		}
	}
}
