; zabbix-web(PHP)が要求する最小限のphp.ini設定 [FR3.2]。値はZabbix公式ドキュメントが
; 要求する下限に合わせる — 公式zabbix-web-nginx-mysqlイメージと同等の挙動とする。
max_execution_time = 300
memory_limit = 128M
post_max_size = 16M
upload_max_filesize = 2M
max_input_time = 300
; date.timezoneはPHP_TZ環境変数からentrypoint.shが動的に上書きする(既定はUTC)。
date.timezone = UTC
