# CI/CDパイプライン(通常フロー: push/pull_request、定期スケジュールフロー: schedule)。
# 単一ワークフローに3トリガーをまとめ、schedule実行はlintのみスキップして検証(verify)
# 以降を通しで再実行する。
name: CI / Release

# Actionsの一覧で、定期実行と手動実行が見分けられるようにする(どれも既定では「CI / Release」になる)。
# push・pull_requestは空にして、GitHubの既定の表示(コミットメッセージの1行目・PRのタイトル)に任せる。
# (head_commit.message をそのまま使うと、複数行のコミットメッセージが一覧に全文出てしまう。)
run-name: >-
  ${{ github.event_name == 'schedule' && '定期の再ビルド・再スキャン(週次)'
  || github.event_name == 'workflow_dispatch' && '手動の再ビルド・再スキャン'
  || '' }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 毎週月曜03:00 UTC。ベースイメージ(Alpine)の定期再ビルド・再スキャンのための
    # 既定値であり、運用者はこのcron式を直接編集していつでも変更できる。
    - cron: "0 3 * * 1"
  workflow_dispatch: {}

env:
  ZABBIX_VERSION: "6.0.48"
  ALPINE_VERSION: "3.24"
  IMAGE_ARCH: "amd64"
  REGISTRY_PATH: "data/vulnerability-registry.yaml"

jobs:
  lint:
    # 警告のみ・非ブロッキング。トラックB(このプロジェクト自身が新規に書くビルド/CI層)
    # のみを対象とし、アップストリームZabbixソース(トラックA)には新規フォーマッタ/
    # リンタを導入しない。schedule実行はコード変更を伴わないためスキップする。
    name: Lint (advisory, Track B only)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: hadolint (Dockerfile)
        uses: hadolint/hadolint-action@v3.5.0
        continue-on-error: true
        with:
          dockerfile: docker/server/Dockerfile

      - name: shellcheck (scripts/*.sh)
        continue-on-error: true
        run: shellcheck scripts/*.sh

  php-version:
    # zabbix-webのPHPはソースからビルドしており、Trivyが脆弱性を判定できない(Alpineのパッケージでは
    # ない)。固定したPHPより新しいリリースが出ていないかを、ここで定期的に確認する。コミットごとには
    # 実行しない(PHPの新リリースで、無関係な変更のCIが赤くなるのを避けるため)。
    name: PHP version check (scheduled)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Compare the pinned PHP version with the latest release
        run: ./scripts/check-php-version.sh

  zabbix-version:
    # 公式イメージの更新を待たずに上流のZabbixへ追従するための目印。Trivyはソースから作った
    # Zabbix本体の脆弱性を判定できないので、取り込み済み(.env.example の ZABBIX_VERSION)より
    # 新しい6.0.xの正式リリースが上流にあれば失敗して知らせる。php-version と同じ理由で定期実行のみ。
    # 取り込みを忘れていても publish は止めない(verify のスキャンとは独立した、お知らせ用のジョブ)。
    name: Zabbix upstream version check (scheduled)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Compare the imported Zabbix version with the upstream tags
        run: ./scripts/check-zabbix-version.sh

  verify:
    # BuildPipeline → ScanRunner(SCA) → ScanRunner(SAST) →
    # SecretScanner(CI、Git差分+イメージレイヤー) → SBOM生成 →
    # CompatibilityTestRunner → 公開前提条件ゲート判定(BR3.1)。
    # `main`へのマージ前にテスト・スキャンを実行する方針に従い、単体テスト
    # (pytest/bats)もここで再実行する。
    name: Verify (tests, build, scan, compat-test)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # 前回のSBOMを取得して、前回ビルドとの差分をJob Summaryに出すため
    services:
      # compat-test.sh のdocker compose起動先。実運用のMySQL(本番DB)ではなく、
      # CI専用の使い捨てインスタンス — 環境変数の配線・起動可否のみを検証する
      # (本プロジェクトは本番MySQLをコンテナ化しない設計のため、これは代替物)。
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: zabbix
          MYSQL_USER: zabbix
          MYSQL_PASSWORD: ci-test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    outputs:
      build_date: ${{ steps.vars.outputs.build_date }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          # scripts/scan-sast.sh diffs against the upstream import commit
          # (data/upstream-import-ref), which a shallow clone would not contain.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install PyYAML pytest semgrep

      - name: Install cppcheck, bats-core
        run: sudo apt-get update && sudo apt-get install -y cppcheck bats

      - name: Install Trivy
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      # govulncheck(Go公式)はTrivyが見逃すGo標準ライブラリの脆弱性を、バイナリが実際に呼ぶ
      # コードに限って判定する。ツール本体はバージョン固定(v1.8.0はGo 1.26以上が必要)、脆弱性DBは
      # 実行時に最新を取得する。
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: false

      - name: Install govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install gitleaks
        # .pre-commit-config.yaml と同じバージョン(v8.21.2)に揃え、pre-commit側と
        # CI側で検出能力が食い違わないようにする[NFR3.1: 二重チェック]。
        run: |
          curl -sSL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          rm gitleaks.tar.gz

      - name: Unit tests (pytest)
        run: python -m pytest tests -q

      - name: Unit tests (bats)
        run: bats tests/scripts

      - name: Compute build date
        id: vars
        run: echo "build_date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      # スキャン・各ゲートの結果の記録先(Job Summary用)。scripts/*.sh が追記し、最後の
      # 「Write Job Summary」が読む。表示専用で、ゲートの判定には影響しない。
      - name: Prepare the Job Summary records
        run: echo "SCAN_SUMMARY_FILE=${RUNNER_TEMP}/ci-summary.jsonl" >> "$GITHUB_ENV"

      - name: Run CI verification pipeline (stages 3-9)
        env:
          BUILD_DATE: ${{ steps.vars.outputs.build_date }}
          DB_SERVER_HOST: 127.0.0.1
          MYSQL_USER: zabbix
          MYSQL_PASSWORD: ci-test-password
          MYSQL_DATABASE: zabbix
          SBOM_DIR: ${{ github.workspace }}/sbom
          # push/PR: SAST only the files changed since the upstream import.
          # schedule/manual: the whole tree, so drift in upstream code or in
          # the scanners' rules surfaces on a regular cadence.
          SAST_SCOPE: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'full' || 'patched' }}
        run: ./scripts/ci-pipeline.sh

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sbom-${{ steps.vars.outputs.build_date }}
          path: sbom/
          if-no-files-found: ignore

      # 前回ビルドからの変更を出すため、main の直近のSBOM(この実行より前のもの)を取ってくる。
      # 見つからない・取れない場合は、比較なしで続ける(Job Summaryが「比較できません」と出す)。
      - name: Fetch the previous SBOM (for the Job Summary)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "${RUNNER_TEMP}/sbom-prev"
          artifact_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq '
            [.artifacts[]
              | select(.name | startswith("sbom-"))
              | select(.expired | not)
              | select(.workflow_run.head_branch == "main")
              | select((.workflow_run.id | tostring) != "'"${GITHUB_RUN_ID}"'")]
            | sort_by(.created_at) | last | .id // empty')"
          if [ -z "${artifact_id}" ]; then
            echo "前回のSBOMが見つかりません(初回、または保存期間切れ)"
            exit 0
          fi
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > "${RUNNER_TEMP}/sbom-prev.zip"
          unzip -q -o "${RUNNER_TEMP}/sbom-prev.zip" -d "${RUNNER_TEMP}/sbom-prev"
          echo "前回のSBOM(artifact ${artifact_id}):"
          ls "${RUNNER_TEMP}/sbom-prev"

      # 「前回から何が変わったか」「脆弱性チェックはどこまで通ったか」を、Runの画面にまとめる。
      - name: Write Job Summary
        if: always()
        continue-on-error: true
        run: |
          python3 -m release_tools.cli ci-summary \
            --records "${SCAN_SUMMARY_FILE}" \
            --sbom-dir sbom \
            --prev-sbom-dir "${RUNNER_TEMP}/sbom-prev" \
            --zabbix-version "${ZABBIX_VERSION}" \
            --alpine-version "${ALPINE_VERSION}" \
            --event "${{ github.event_name }}" \
            --build-date "${{ steps.vars.outputs.build_date }}" \
            --trivy-db >> "${GITHUB_STEP_SUMMARY}"

  publish:
    # セルフレビュー承認ゲート(BR3.2)→ 公開 → cosign keyless署名 → SBOM添付。
    # トリガー種別(push/pull_request/schedule)を問わず常に発生する。
    #
    # BR3.2のセルフレビュー承認は、この`environment: production`に対する
    # GitHub Actions Environment protection rule(必須レビュアー)で実装する。
    # レビュアーが承認するまでこのジョブ自体が開始しない。Environmentの作成・
    # 必須レビュアー設定はGitHub側の手動セットアップが必要(README.md参照、
    # このワークフローファイルの変更だけでは有効化されない)。
    name: Publish (manual self-review gate)
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write # cosign keyless署名(Sigstore OIDC)用
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install PyYAML

      - uses: sigstore/cosign-installer@v4.1.2

      - uses: actions/download-artifact@v8
        with:
          name: sbom-${{ needs.verify.outputs.build_date }}
          path: sbom

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Rebuild images (fresh, matching the already-verified commit)
        env:
          BUILD_DATE: ${{ needs.verify.outputs.build_date }}
        run: ./scripts/build-images.sh

      - name: Publish each component
        # BR3.1(4条件ゲート)はpush-images.sh内部でも再判定される。BR3.2の人による
        # セルフレビューは、このジョブに到達する前のEnvironment承認で既に済んでいる
        # ため、ここでは`--yes`で非対話的に確認済みとして扱う(二重の対話待ちで
        # CIをデッドロックさせないため)。
        env:
          BUILD_DATE: ${{ needs.verify.outputs.build_date }}
        run: |
          set -euo pipefail
          {
            echo "## 公開したイメージ"
            echo ""
          } >> "${GITHUB_STEP_SUMMARY}"
          for component in zabbix-server zabbix-web zabbix-agent2 zabbix-proxy; do
            tag="$(python3 -m release_tools.cli generate-tag \
              --component "${component}" --zabbix-version "${ZABBIX_VERSION}" \
              --build-date "${BUILD_DATE}" --arch "${IMAGE_ARCH}")"
            sbom_file="sbom/$(echo "${tag}" | tr '/:' '__').cyclonedx.json"
            ./scripts/push-images.sh --tag "${tag}" \
              --sca Pass --sast Pass --compat Pass --secret Clean \
              --sbom "${sbom_file}" --yes
            echo "- \`${tag}\`" >> "${GITHUB_STEP_SUMMARY}"
          done
